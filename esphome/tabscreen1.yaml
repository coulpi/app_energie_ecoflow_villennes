interval:
  # ── Lecture de l'appli ───────────────────────────────
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: ${screen_api_url}
                capture_response: true
                max_response_buffer_size: 1024
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("screen", "HTTP %d", response->status_code);
                          return;
                        }
                        bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                          id(g_prod) = root["prod"] | 0;
                          id(g_conso) = root["conso"] | 0;
                          id(g_grid) = root["grid"] | 0;
                          id(g_aux) = root["aux"] | 0;
                          id(g_soc) = root["soc"] | -1;
                          id(g_bat) = root["bat"] | 0;
                          id(g_temp) = root["temp"] | -99.0f;
                          id(g_tempo) = std::string(root["tempo"] | "");
                          id(g_tempo_dem) = std::string(root["tempo_dem"] | "");
                          id(g_meteo) = std::string(root["meteo"] | "");
                          id(g_jac_t) = root["jac_t"] | -99.0f;
                          id(g_jac_c) = root["jac_c"] | -99.0f;
                          id(g_jac_h) = root["jac_h"] | -1;
                          id(g_jac_f) = root["jac_f"] | -1;
                          id(g_jac_w) = root["jac_w"] | 0;
                          return true;
                        });
                        if (ok) id(g_last_ok) = millis();
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        format: "Appli injoignable"

  # ── Horloge + Date ───────────────────────────────────
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(sntp_time).now().is_valid();
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda |-
                  static char buf[8];
                  auto now = id(sntp_time).now();
                  snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
                  return std::string(buf);
            - lvgl.label.update:
                id: date_label
                text: !lambda |-
                  static char buf[32];
                  auto now = id(sntp_time).now();
                  const char* days[]   = {"", "dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."};
                  const char* months[] = {"", "jan.", "fev.", "mar.", "avr.", "mai", "jun.",
                                          "jul.", "aou.", "sep.", "oct.", "nov.", "dec."};
                  snprintf(buf, sizeof(buf), "%s %d %s %d",
                    days[now.day_of_week],
                    now.day_of_month,
                    months[now.month],
                    now.year);
                  return std::string(buf);

  # ── Mise à jour de l'affichage (2 s) ─────────────────
  # Au-delà de 30 s sans réponse de l'appli : valeurs remplacées par « -- ».
  - interval: 2s
    then:
      - lvgl.label.update:
          id: production_label
          text: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return std::string("--");
            return std::to_string(id(g_prod));

      - lvgl.label.update:
          id: grid_title_label
          text: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return std::string("RESEAU");
            if (id(g_grid) > 30) return std::string("ACHAT RESEAU");
            if (id(g_grid) < -30) return std::string("INJECTION");
            return std::string("RESEAU");

      - lvgl.label.update:
          id: grid_label
          text: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return std::string("--");
            return std::to_string(abs(id(g_grid))) + " W";

      - lvgl.label.update:
          id: consumption_label
          text: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return std::string("appli injoignable");
            return "conso " + std::to_string(id(g_conso)) + " W";

      - lvgl.widget.update:
          id: consumption_card
          bg_color: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return lv_color_hex(0x161B22);
            if (id(g_grid) > 30) return lv_color_hex(0x5C1A1A);
            if (id(g_grid) < -30) return lv_color_hex(0x1A3D2B);
            return lv_color_hex(0x161B22);
          border_color: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return lv_color_hex(0x30363D);
            if (id(g_grid) > 30) return lv_color_hex(0xF78166);
            if (id(g_grid) < -30) return lv_color_hex(0x3FB950);
            return lv_color_hex(0x30363D);

      - lvgl.label.update:
          id: battery_label
          text: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale || id(g_soc) < 0) return std::string("--");
            return std::to_string(id(g_soc)) + " %";
          text_color: !lambda |-
            int s = id(g_soc);
            if (s < 0) return lv_color_hex(0xA371F7);
            if (s < 20) return lv_color_hex(0xF85149);
            if (s < 50) return lv_color_hex(0xD29922);
            return lv_color_hex(0x3FB950);

      - lvgl.label.update:
          id: battery_state_label
          text: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return std::string("--");
            char buf[32];
            int b = id(g_bat);
            if (b > 30) snprintf(buf, sizeof(buf), "decharge %d W", b);
            else if (b < -30) snprintf(buf, sizeof(buf), "charge %d W", -b);
            else snprintf(buf, sizeof(buf), "veille");
            return std::string(buf);

      # Tempo du jour / lendemain
      - lvgl.label.update:
          id: tempo_today_label
          text: !lambda |-
            const std::string& t = id(g_tempo);
            if (t == "BLUE")  return std::string("Auj. BLEU");
            if (t == "WHITE") return std::string("Auj. BLANC");
            if (t == "RED")   return std::string("Auj. ROUGE");
            return std::string("Auj. --");
          text_color: !lambda |-
            return id(g_tempo) == "WHITE" ? lv_color_hex(0x0D1117) : lv_color_hex(0xFFFFFF);
      - lvgl.widget.update:
          id: tempo_today_pill
          bg_color: !lambda |-
            const std::string& t = id(g_tempo);
            if (t == "BLUE")  return lv_color_hex(0x1F6FEB);
            if (t == "WHITE") return lv_color_hex(0xE6EDF3);
            if (t == "RED")   return lv_color_hex(0xDA3633);
            return lv_color_hex(0x30363D);
      - lvgl.label.update:
          id: tempo_dem_label
          text: !lambda |-
            const std::string& t = id(g_tempo_dem);
            if (t == "BLUE")  return std::string("Demain BLEU");
            if (t == "WHITE") return std::string("Demain BLANC");
            if (t == "RED")   return std::string("Demain ROUGE");
            return std::string("Demain --");
          text_color: !lambda |-
            return id(g_tempo_dem) == "WHITE" ? lv_color_hex(0x0D1117) : lv_color_hex(0xFFFFFF);
      - lvgl.widget.update:
          id: tempo_dem_pill
          bg_color: !lambda |-
            const std::string& t = id(g_tempo_dem);
            if (t == "BLUE")  return lv_color_hex(0x1F6FEB);
            if (t == "WHITE") return lv_color_hex(0xE6EDF3);
            if (t == "RED")   return lv_color_hex(0xDA3633);
            return lv_color_hex(0x30363D);

      # Température
      - lvgl.label.update:
          id: temp_label
          text: !lambda |-
            if (id(g_temp) <= -98) return std::string("--°C");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f°C", id(g_temp));
            return std::string(buf);

      # Icone météo MDI
      - lvgl.label.update:
          id: weather_icon
          text: !lambda |-
            const std::string& s = id(g_meteo);
            if (s == "sunny")            return std::string("\U000F0599");
            if (s == "clear-night")      return std::string("\U000F0594");
            if (s == "partlycloudy")     return std::string("\U000F0595");
            if (s == "cloudy")           return std::string("\U000F0590");
            if (s == "rainy")            return std::string("\U000F0597");
            if (s == "pouring")          return std::string("\U000F0596");
            if (s == "snowy")            return std::string("\U000F059D");
            if (s == "fog")              return std::string("\U000F0591");
            if (s == "lightning")        return std::string("\U000F0593");
            if (s == "lightning-rainy")  return std::string("\U000F067E");
            if (s == "windy")            return std::string("\U000F059F");
            if (s == "hail")             return std::string("\U000F0592");
            return std::string("\U000F0898");

      # Libelle météo
      - lvgl.label.update:
          id: weather_label
          text: !lambda |-
            const std::string& s = id(g_meteo);
            if (s.empty())               return std::string("indisponible");
            if (s == "sunny")            return std::string("Ensoleille");
            if (s == "clear-night")      return std::string("Nuit claire");
            if (s == "partlycloudy")     return std::string("Partiell. nuageux");
            if (s == "cloudy")           return std::string("Nuageux");
            if (s == "rainy")            return std::string("Pluvieux");
            if (s == "pouring")          return std::string("Fortes pluies");
            if (s == "snowy")            return std::string("Neigeux");
            if (s == "fog")              return std::string("Brouillard");
            if (s == "lightning")        return std::string("Orageux");
            if (s == "lightning-rainy")  return std::string("Orage et pluie");
            if (s == "windy")            return std::string("Venteux");
            if (s == "hail")             return std::string("Grele");
            return s;

  # ── Courbe 24 h : lue au démarrage puis toutes les 5 min ───
  - interval: 20s
    then:
      - if:
          condition:
            lambda: |-
              return wifi::global_wifi_component->is_connected() &&
                     (id(g_chart_at) == 0 || millis() - id(g_chart_at) > 300000);
          then:
            - http_request.get:
                url: ${screen_api_url}/chart
                capture_response: true
                max_response_buffer_size: 2048
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) -> bool {
                          int mx = root["max"] | 1000;
                          if (mx <= 0) mx = 1000;
                          // Zone de tracé 420 × 170 px ; -1 (pas de mesure) → 0.
                          // LVGL 9 (ESPHome ≥ 2026.x) : FixedVector<lv_point_precise_t>.
                          auto build = [mx](JsonArray arr) {
                            FixedVector<lv_point_precise_t> pts;
                            int n = arr.size();
                            if (n < 2) return pts;
                            pts.init(n);
                            int i = 0;
                            for (JsonVariant v : arr) {
                              int w = v.as<int>();
                              if (w < 0) w = 0;
                              if (w > mx) w = mx;
                              lv_point_precise_t pt;
                              pt.x = (lv_value_precise_t) (i * 420 / (n - 1));
                              pt.y = (lv_value_precise_t) (170 - (long) w * 170 / mx);
                              pts.push_back(pt);
                              i++;
                            }
                            return pts;
                          };
                          auto pp = build(root["p"].as<JsonArray>());
                          auto cc = build(root["c"].as<JsonArray>());
                          if (pp.size() >= 2) id(chart_prod)->set_points(std::move(pp));
                          if (cc.size() >= 2) id(chart_conso)->set_points(std::move(cc));
                          id(g_chart_max) = mx;
                          return true;
                        });
                        id(g_chart_at) = millis();
                    - lvgl.label.update:
                        id: chart_max_label
                        text: !lambda |-
                          char buf[16];
                          int mx = id(g_chart_max);
                          if (mx >= 1000) snprintf(buf, sizeof(buf), "%.1f kW", mx / 1000.0f);
                          else snprintf(buf, sizeof(buf), "%d W", mx);
                          return std::string(buf);

  # ── Défilement automatique (15 s), suspendu 1 min après un toucher ──
  - interval: 15s
    then:
      - if:
          condition:
            lambda: return millis() - id(g_last_touch) > 60000;
          then:
            - lvgl.page.next:

  # ── Page 2 : horloge + jacuzzi ───────────────────────
  - interval: 2s
    then:
      - lvgl.label.update:
          id: clock2_label
          text: !lambda |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: jac_temp_label
          text: !lambda |-
            if (id(g_jac_t) <= -98) return std::string("--°C");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f°C", id(g_jac_t));
            return std::string(buf);
          text_color: !lambda |-
            // Orange si on chauffe vers la consigne, cyan sinon.
            return id(g_jac_h) == 1 ? lv_color_hex(0xF0883E) : lv_color_hex(0x22D3EE);
      - lvgl.label.update:
          id: jac_preset_label
          text: !lambda |-
            if (id(g_jac_c) <= -98) return std::string("consigne --°C");
            char buf[24];
            snprintf(buf, sizeof(buf), "consigne %.0f°C", id(g_jac_c));
            return std::string(buf);
      - lvgl.label.update:
          id: jac_heat_label
          text: !lambda |-
            int h = id(g_jac_h);
            return std::string(h == 1 ? "Chauffe ON" : h == 2 ? "Maintien" : h == 0 ? "Chauffe OFF" : "Chauffe --");
          text_color: !lambda |-
            return id(g_jac_h) == 1 ? lv_color_hex(0xF0883E) : lv_color_hex(0x8B949E);
      - lvgl.label.update:
          id: jac_filter_label
          text: !lambda |-
            int f = id(g_jac_f);
            return std::string(f == 1 ? "Filtration ON" : f == 0 ? "Filtration OFF" : "Filtration --");
          text_color: !lambda |-
            return id(g_jac_f) == 1 ? lv_color_hex(0x3FB950) : lv_color_hex(0x8B949E);
      - lvgl.label.update:
          id: jac_power_label
          text: !lambda |-
            bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
            if (stale) return std::string("-- W");
            return std::to_string(id(g_jac_w)) + " W";

  # ── Page 3 : production par panneau (60 s ; l'ECU publie toutes les 5 min) ──
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              return wifi::global_wifi_component->is_connected() &&
                     (id(g_solar_at) == 0 || millis() - id(g_solar_at) > 60000);
          then:
            - http_request.get:
                url: ${screen_api_url}/solar
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) -> bool {
                          lv_obj_t *tiles[12] = {
                            id(sp_t0), id(sp_t1), id(sp_t2), id(sp_t3), id(sp_t4), id(sp_t5),
                            id(sp_t6), id(sp_t7), id(sp_t8), id(sp_t9), id(sp_t10), id(sp_t11)};
                          lv_obj_t *labels[12] = {
                            id(sp_l0), id(sp_l1), id(sp_l2), id(sp_l3), id(sp_l4), id(sp_l5),
                            id(sp_l6), id(sp_l7), id(sp_l8), id(sp_l9), id(sp_l10), id(sp_l11)};
                          JsonArray w = root["w"].as<JsonArray>();
                          JsonArray st = root["s"].as<JsonArray>();
                          for (int i = 0; i < 12; i++) {
                            int watts = w[i] | -1;
                            int state = st[i] | 0;
                            // 0 indispo, 1 production, 2 0 W, 3 pas de réseau AC
                            uint32_t bg = 0x161B22, border = 0x30363D, txt = 0x8B949E;
                            if (state == 1) { bg = 0x12301F; border = 0x3FB950; txt = 0xFFFFFF; }
                            else if (state == 2) { txt = 0xC9D1D9; }
                            else if (state == 3) { bg = 0x3A1418; border = 0xF85149; txt = 0xF85149; }
                            lv_obj_set_style_bg_color(tiles[i], lv_color_hex(bg), LV_PART_MAIN);
                            lv_obj_set_style_border_color(tiles[i], lv_color_hex(border), LV_PART_MAIN);
                            lv_obj_set_style_text_color(labels[i], lv_color_hex(txt), LV_PART_MAIN);
                            if (state == 0 || watts < 0) lv_label_set_text(labels[i], "--");
                            else lv_label_set_text(labels[i], std::to_string(watts).c_str());
                          }
                          char buf[40];
                          snprintf(buf, sizeof(buf), "JARDIN   %d W", (int) (root["z0"] | 0));
                          lv_label_set_text(id(sp_z0), buf);
                          snprintf(buf, sizeof(buf), "ABRI   %d W", (int) (root["z1"] | 0));
                          lv_label_set_text(id(sp_z1), buf);
                          int tot = (int) (root["z0"] | 0) + (int) (root["z1"] | 0);
                          snprintf(buf, sizeof(buf), "Total %d W  -  %d/12 en production", tot, (int) (root["on"] | 0));
                          lv_label_set_text(id(sp_tot), buf);
                          return true;
                        });
                        id(g_solar_at) = millis();
      - lvgl.label.update:
          id: clock3_label
          text: !lambda |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);

  # ── Animation batterie (page 1) ──────────────────────
  # Charge : remplissage qui monte en boucle du niveau actuel jusqu'au plein
  # (vert). Décharge : se vide en boucle du niveau actuel jusqu'à 0 (orange).
  # Veille : niveau fixe.
  - interval: 120ms
    then:
      - lambda: |-
          static int phase = 0;
          const int MAXW = 52;
          int soc = id(g_soc);
          bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
          int base = (soc < 0 || stale) ? 0 : (soc * MAXW) / 100;
          int bat = stale ? 0 : id(g_bat);
          int w = base;
          uint32_t color;
          if (bat < -30) {          // charge
            int span = MAXW - base;
            if (span < 8) span = 8;
            phase = (phase + 3) % (span + 10);
            w = base + (phase > span ? span : phase);
            if (w > MAXW) w = MAXW;
            color = 0x3FB950;
          } else if (bat > 30) {    // décharge
            int span = base < 8 ? 8 : base;
            phase = (phase + 3) % (span + 10);
            w = base - (phase > span ? span : phase);
            if (w < 0) w = 0;
            color = 0xF0883E;
          } else {
            phase = 0;
            color = soc < 0 ? 0x8B949E : soc < 20 ? 0xF85149 : soc < 50 ? 0xD29922 : 0x3FB950;
          }
          lv_obj_set_width(id(bat_fill), w);
          lv_obj_set_style_bg_color(id(bat_fill), lv_color_hex(color), LV_PART_MAIN);

  # ── Bandeau conso / réseau des pages 2 et 3 ──────────
  - interval: 2s
    then:
      - lambda: |-
          bool stale = id(g_last_ok) == 0 || millis() - id(g_last_ok) > 30000;
          int g = id(g_grid);
          char conso[24], grid[24];
          uint32_t bg = 0x161B22, border = 0x30363D;
          if (stale) {
            snprintf(conso, sizeof(conso), "conso --");
            snprintf(grid, sizeof(grid), "RESEAU --");
          } else {
            snprintf(conso, sizeof(conso), "conso %d W", id(g_conso));
            if (g > 30) { snprintf(grid, sizeof(grid), "ACHAT %d W", g); bg = 0x5C1A1A; border = 0xF78166; }
            else if (g < -30) { snprintf(grid, sizeof(grid), "INJECT. %d W", -g); bg = 0x1A3D2B; border = 0x3FB950; }
            else snprintf(grid, sizeof(grid), "RESEAU %d W", g);
          }
          lv_obj_t *pills[2] = {id(grid2_pill), id(grid3_pill)};
          lv_obj_t *glabels[2] = {id(grid2_label), id(grid3_label)};
          lv_obj_t *clabels[2] = {id(conso2_label), id(conso3_label)};
          for (int i = 0; i < 2; i++) {
            lv_obj_set_style_bg_color(pills[i], lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_border_color(pills[i], lv_color_hex(border), LV_PART_MAIN);
            lv_label_set_text(glabels[i], grid);
            lv_label_set_text(clabels[i], conso);
          }
