# Mosquitto config minimale pour ingerer les trames APSystems depuis
# l'ESP+CC2530 (2e maison). Reseau LAN interne, pas de TLS.
#
# Pour activer un mot de passe (recommande meme en LAN) :
#   1. docker compose --profile apsystems run --rm mosquitto mosquitto_passwd -c /mosquitto/config/passwd apsystems
#   2. Decommenter les 2 lignes "password_file" et "allow_anonymous false" ci-dessous
#   3. Renseigner APSYSTEMS_MQTT_USER / APSYSTEMS_MQTT_PASSWORD dans le .env
#   4. docker compose --profile apsystems up -d --force-recreate mosquitto

listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Anonymous par defaut (LAN ferme). Decommenter pour activer auth :
# password_file /mosquitto/config/passwd
# allow_anonymous false
allow_anonymous true
