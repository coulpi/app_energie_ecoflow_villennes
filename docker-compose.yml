services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ecoflow}
      TZ: Europe/Paris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port non exposé sur l'hôte par défaut (uniquement réseau Docker
    # interne). Pour un accès externe (psql, prisma studio depuis l'hôte)
    # ajouter manuellement `ports: ["5432:5432"]` ou utiliser docker exec.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-EcoFlow Villennes}
      WORKER_INTERNAL_URL: http://worker:3100
      # Credentials Tuya pour le bouton "Tester" sur /devices (poll one-shot
      # depuis le process Next).
      TUYA_CLIENT_ID: ${TUYA_CLIENT_ID:-}
      TUYA_CLIENT_SECRET: ${TUYA_CLIENT_SECRET:-}
      TUYA_API_BASE: ${TUYA_API_BASE:-}
      TZ: Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ECOFLOW_ACCESS_KEY: ${ECOFLOW_ACCESS_KEY}
      ECOFLOW_SECRET_KEY: ${ECOFLOW_SECRET_KEY}
      ECOFLOW_API_BASE: ${ECOFLOW_API_BASE}
      ECOFLOW_EMAIL: ${ECOFLOW_EMAIL:-}
      ECOFLOW_PASSWORD: ${ECOFLOW_PASSWORD:-}
      ECOFLOW_MQTT_BROKER: ${ECOFLOW_MQTT_BROKER}
      ECOFLOW_MQTT_PORT: ${ECOFLOW_MQTT_PORT}
      TUYA_CLIENT_ID: ${TUYA_CLIENT_ID}
      TUYA_CLIENT_SECRET: ${TUYA_CLIENT_SECRET}
      TUYA_REGION: ${TUYA_REGION}
      TUYA_API_BASE: ${TUYA_API_BASE}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
      HOURLY_RETENTION_DAYS: ${HOURLY_RETENTION_DAYS:-365}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b-instruct}
      AGENT_INTERVAL_MINUTES: ${AGENT_INTERVAL_MINUTES:-60}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      BATTERY_CRITICAL_SOC: ${BATTERY_CRITICAL_SOC:-5}
      HOME_LAT: ${HOME_LAT:-48.9436}
      HOME_LON: ${HOME_LON:-1.993}
      HOME_TZ: ${HOME_TZ:-Europe/Paris}
      INTEX_SPA_HOST: ${INTEX_SPA_HOST:-}
      INTEX_SPA_PORT: ${INTEX_SPA_PORT:-8990}
      INTEX_SPA_ENABLED: ${INTEX_SPA_ENABLED:-false}
      APSYSTEMS_MQTT_URL: ${APSYSTEMS_MQTT_URL:-}
      APSYSTEMS_MQTT_USER: ${APSYSTEMS_MQTT_USER:-}
      APSYSTEMS_MQTT_PASSWORD: ${APSYSTEMS_MQTT_PASSWORD:-}
      APSYSTEMS_TOPIC_PREFIX: ${APSYSTEMS_TOPIC_PREFIX:-apsystems}
      APSYSTEMS_MOCK: ${APSYSTEMS_MOCK:-0}
      APSYSTEMS_MOCK_INTERVAL_S: ${APSYSTEMS_MOCK_INTERVAL_S:-15}
      TZ: Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy

  # Broker MQTT pour ingerer les trames de la passerelle ESP+CC2530
  # APSystems (2e maison). Activation via profile docker compose :
  #   docker compose --profile apsystems up -d
  # Necessite mosquitto.conf + (optionnel) passwd dans ./mosquitto/config/
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["apsystems"]
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    environment:
      TZ: Europe/Paris

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
